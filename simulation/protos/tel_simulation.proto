 /*******************************************************************
  * Services Definition                                             *
  *******************************************************************/
 service CardService {
     rpc InitService(google.protobuf.Empty) returns (commonStub.GetServiceStatusReply) {}
     rpc GetServiceStatus(google.protobuf.Empty) returns (commonStub.GetServiceStatusReply) {}
     rpc IsSubsystemReady(google.protobuf.Empty) returns (commonStub.IsSubsystemReadyReply) {}
     rpc CleanUpService(google.protobuf.Empty) returns (google.protobuf.Empty) {}
     rpc GetCardState(GetCardStateRequest) returns (GetCardStateReply) {}
     rpc GetSupportedApps(GetSupportedAppsRequest) returns (GetSupportedAppsReply) {}
     rpc ReadEFLinearFixed(ReadEFLinearFixedRequest) returns (ReadEFLinearFixedReply) {}
     rpc ReadEFLinearFixedAll(ReadEFLinearFixedAllRequest) returns (ReadEFLinearFixedAllReply) {}
     rpc ReadEFTransparent(ReadEFTransparentRequest) returns (ReadEFTransparentReply) {}
     rpc WriteEFLinearFixed(WriteEFLinearFixedRequest) returns (WriteEFLinearFixedReply) {}
     rpc WriteEFTransparent(WriteEFTransparentRequest) returns (WriteEFTransparentReply) {}
     rpc RequestEFAttributes(EFAttributesRequest) returns (RequestEFAttributesReply) {}
     rpc OpenLogicalChannel(OpenLogicalChannelRequest) returns (OpenLogicalChannelReply) {}
     rpc CloseLogicalChannel(CloseLogicalChannelRequest) returns (CloseLogicalChannelReply) {}
     rpc TransmitAPDU(TransmitAPDURequest) returns (TransmitAPDUReply) {}
     rpc TransmitBasicAPDU(TransmitBasicAPDURequest) returns (TransmitBasicAPDUReply) {}
     rpc SetCardLock(SetCardLockRequest) returns (SetCardLockReply) {}
     rpc QueryPin1Lock(QueryPin1LockRequest) returns (QueryPin1LockReply) {}
     rpc ChangePinLock(ChangePinLockRequest) returns (ChangePinLockReply) {}
     rpc UnlockByPin(UnlockByPinRequest) returns (UnlockByPinReply) {}
     rpc UnlockByPuk(UnlockByPukRequest) returns (UnlockByPukReply) {}
     rpc QueryFdnLock(QueryFdnLockRequest) returns (QueryFdnLockReply) {}
     rpc updateSimStatus(updateSimStatusRequest) returns (updateSimStatusReply){}
     rpc CardPower(CardPowerRequest) returns (CardPowerResponse) {}
     rpc exchangeSimIO(exchangeSimIORequest) returns (exchangeSimIOReply) {}
     rpc requestEid(requestEidRequest) returns (requestEidReply) {}
 }


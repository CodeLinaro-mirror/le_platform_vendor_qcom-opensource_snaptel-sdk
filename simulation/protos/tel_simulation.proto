     string aid = 5;
 }

 message ReadEFLinearFixedReply {
     IccResult result = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }

 message ReadEFLinearFixedAllRequest {
     int32 slot_id = 1;
     string file_path = 2;
     int32 file_id = 3;
     string aid = 4;
 }

 message ReadEFLinearFixedAllReply {
     repeated IccResult records = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }

 message ReadEFTransparentRequest {
     int32 slot_id = 1;
     string file_path = 2;
     int32 file_id = 3;
     int32 size = 4;
     string aid = 5;
 }

 message ReadEFTransparentReply {
     IccResult result = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }
 message WriteEFLinearFixedRequest {
     int32 slot_id = 1;
     string file_path = 2;
     int32 file_id = 3;
     int32 record_number = 4;
     repeated int32 data = 5;
     string pin2 = 6;
     string aid = 7;
 }

 message WriteEFLinearFixedReply {
     IccResult result = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     repeated int32 data = 5;
     bool isCallback = 6;
 }

 message WriteEFTransparentRequest {
     int32 slot_id = 1;
     string file_path = 2;
     int32 file_id = 3;
     repeated int32 data = 4;
     string aid = 5;
 }

 message WriteEFTransparentReply {
     IccResult result = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }
 enum EfType {
     UNKNOWN = 0;
     TRANSPARENT = 1;
     LINEAR_FIXED = 2;
 }
 enum CardLockType {
   PIN1 = 0;
   PIN2 = 1;
   PUK1 = 2;
   PUK2 = 3;
   FDN  = 4;
};

 message EFAttributesRequest {
     int32 slot_id = 1;
     EfType ef_type = 2;
     string file_path = 3;
     int32 file_id = 4;
     string aid = 5;
 }

 message FileAttributes {
     int32 file_size = 1;
     int32 record_size = 2;
     int32 record_count = 3;
 }

 message RequestEFAttributesReply {
     IccResult result = 1;
     FileAttributes file_attributes = 2;
     commonStub.ErrorCode error = 3;
     commonStub.Status status = 4;
     int32 delay = 5;
     bool isCallback = 6;
 }

 message OpenLogicalChannelRequest {
     int32 phone_id = 1;
     string app_id = 2;
 }

 message OpenLogicalChannelReply {
     int32 channel_id = 1;
     IccResult result = 2;
     commonStub.ErrorCode error = 3;
     commonStub.Status status = 4;
     int32 delay = 5;
     bool isCallback = 6;
 }

 message CloseLogicalChannelRequest {
     int32 phone_id = 1;
     int32 channel_id = 2;
 }
 message CloseLogicalChannelReply {
     commonStub.ErrorCode error = 1;
     commonStub.Status status = 2;
     int32 delay = 3;
     bool isCallback = 4;
 }

 message TransmitAPDURequest {
     int32 phone_id = 1;
     int32 cla = 2;
     int32 instruction = 3;
     int32 p1 = 4;
     int32 p2 = 5;
     int32 p3 = 6;
     repeated int32 data = 7;
 }

 message TransmitAPDUReply {
     IccResult result = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }

 message exchangeSimIORequest {
     int32 phone_id = 1;
     int32 fileId = 2;
     int32 command = 3;
     int32 p1 = 4;
     int32 p2 = 5;
     int32 p3 = 6;
     repeated int32 data = 7;
 }

 message exchangeSimIOReply {
     IccResult result = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }

 message requestEidRequest {
    int32 phone_id = 1;
 }

 message requestEidReply {
    string eid = 1;
    commonStub.Status status = 2;
    commonStub.ErrorCode error = 3;
    int32 delay = 4;
    bool isCallback = 5;
 }

 message TransmitBasicAPDURequest {
     int32 phone_id = 1;
     int32 cla = 2;
     int32 instruction = 3;
     int32 p1 = 4;
     int32 p2 = 5;
     int32 p3 = 6;
     repeated int32 data = 7;
 }

 message TransmitBasicAPDUReply {
     IccResult result = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }
 message SetCardLockRequest {
     int32 phone_id = 1;
     CardLockType lock_type = 2;
     string pwd = 3;
     bool enable = 4;
     string aid = 5;
 }

 message SetCardLockReply {
     int32 retry_count = 1;
     bool iscardinfochanged = 2;
     commonStub.ErrorCode error = 3;
     commonStub.Status status = 4;
     int32 delay = 5;
     bool isCallback = 6;
 }

 message QueryPin1LockRequest {
     int32 phone_id = 1;
 }

 message QueryPin1LockReply {
     bool state = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }

 message ChangePinLockRequest {
     int32 phone_id = 1;
     CardLockType lock_type = 2;
     string old_pin = 3;
     string new_pin = 4;
     string aid = 5;
 }

 message ChangePinLockReply {
     int32 retry_count = 1;
     bool isCardInfoChanged = 2;
     commonStub.ErrorCode error = 3;
     commonStub.Status status = 4;
     int32 delay = 5;
     bool isCallback = 6;
 }

 message UnlockByPinRequest {
     int32 phone_id = 1;
     CardLockType lock_type = 2;

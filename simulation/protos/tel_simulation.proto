    commonStub.Status status = 4;
    int32 delay = 5;
    bool iscallback = 6;
 }

 message SmsMessage {
    string text = 1;
    string sender = 2;
    string receiver = 3;
    MessageAttributes.SmsEncoding encoding = 4;
    string pdu = 5;
    string pdu_buff = 6;
    uint32 messageinforef_no = 7;
    uint32 messageinfono_of_segments = 8;
    uint32 messageinfosegment_no = 9;
    bool ismetainfo_valid = 10;
    uint32 msg_index = 11;
    SmsTagType.TagType tag_type = 12;
    int32 phone_id = 13;
 }

 message cardInfoChange {
    int32 phone_id = 1;
    bool card_power = 2;
 }

 message memoryFullEvent {
    int32 phone_id = 1;
    StorageType.Type storage_type = 2;
 }

 message CallDirection {
     enum Direction {
         INCOMING = 0;
         OUTGOING = 1;
         NONE = 2;
     }
 }

 enum CallState {
     CALL_ACTIVE = 0;
     CALL_ON_HOLD = 1;
     CALL_DIALING = 2;
     CALL_INCOMING = 3;
     CALL_WAITING = 4;
     CALL_ALERTING = 5;
     CALL_ENDED = 6;
     CALL_IDLE = -1;
 }

 message CallEndCause {
     enum Cause {
         DUMMY = 0;
         UNOBTAINABLE_NUMBER = 1;
         NO_ROUTE_TO_DESTINATION = 3;
         CHANNEL_UNACCEPTABLE = 6;
         OPERATOR_DETERMINED_BARRING = 8;
         NORMAL = 16;
         BUSY = 17;
         NO_USER_RESPONDING = 18;
         NO_ANSWER_FROM_USER = 19;
         NOT_REACHABLE = 20;
         CALL_REJECTED = 21;
         NUMBER_CHANGED = 22;

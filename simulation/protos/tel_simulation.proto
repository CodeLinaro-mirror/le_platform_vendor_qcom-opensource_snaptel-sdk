   EndReasonType failure_reason = 3;
   string apn_name = 4;
   commonStub.ErrorCode error = 5;
   commonStub.Status status = 6;
   int32 delay = 7;
   bool is_callback = 8;
 }

 // --- NetworkSelectionService ---

 message RequestNetworkSelectionModeRequest {
     int32 phone_id = 1;
 }

 message NetworkSelectionMode {
     enum Mode {
         AUTOMATIC = 0;
         MANUAL = 1;
         UNKNOWN = -1;
     }
     Mode mode = 1;
 }

 message RequestNetworkSelectionModeReply {
     NetworkSelectionMode.Mode mode = 1 ;
     string mnc = 2;
     string mcc = 3;
     commonStub.ErrorCode error = 4;
     commonStub.Status status = 5;
     int32 delay = 6;
     bool is_callback = 7;
 }

 message SetNetworkSelectionModeRequest {
     int32 phone_id = 1;
     NetworkSelectionMode.Mode mode = 2;
     string mnc = 3;
     string mcc = 4;
 }

 message SetNetworkSelectionModeReply {
     commonStub.ErrorCode error = 1;
     commonStub.Status status = 2;
     int32 delay = 3;
     bool is_callback = 4;
 }

 message RequestPreferredNetworksRequest {
     int32 phone_id = 1;
 }

 message RatType {
     enum Type {
        UNKNOWN = 0;
        UMTS = 15;
        LTE = 14;
        GSM = 7;
        NR5G = 11;
     }
 }

 message PreferredNetworkInfo {
     int32 mcc = 1;
     int32 mnc = 2;
     repeated RatType.Type types = 3;
 }

 message RequestPreferredNetworksReply {
     repeated PreferredNetworkInfo preferred = 1;
     repeated PreferredNetworkInfo static_preferred = 2;
     commonStub.ErrorCode error = 3;
     commonStub.Status status = 4;
     int32 delay = 5;
     bool is_callback = 6;
 }

 message SetPreferredNetworksRequest {
     int32 phone_id = 1;
     repeated PreferredNetworkInfo preferred_networks_info = 2;
     bool clear_previous = 3;
 }

 message SetPreferredNetworksReply {
     commonStub.ErrorCode error = 1;
     commonStub.Status status = 2;
     int32 delay = 3;
     bool is_callback = 4;
 }

 enum NetworkScanType {
    NOT_DEFINED = 0 ;
    CURRENT_RAT_PREFERENCE = 1;
    USER_SPECIFIED_RAT = 2;
    ALL_RATS = 3;
 }

 message PerformNetworkScanRequest {
     int32 phone_id = 1;
     NetworkScanType scan_type = 2;
     repeated RatType.Type rat_types = 3;
 }

 message PerformNetworkScanReply {
     commonStub.ErrorCode error = 1;
     commonStub.Status status = 2;
     int32 delay = 3;
     bool is_callback = 4;
 }

 message InUseStatus{
     enum Status {
         UNKNOWN = 0;
         CURRENT_SERVING = 1;
         AVAILABLE = 2;
     }
 }

 message RoamingStatus{
     enum Status {
         UNKNOWN = 0;
         HOME = 1;
         ROAM = 2;
     }
 }

 message ForbiddenStatus{
     enum Status {
         UNKNOWN = 0;
         FORBIDDEN = 1;
         NOT_FORBIDDEN = 2;
     }
 }

 message PreferredStatus{
     enum Status {
         UNKNOWN = 0;
         PREFERRED = 1;
         NOT_PREFERRED = 2;
     }
 }

 message OperatorStatus {
     InUseStatus.Status inuse = 1;
     RoamingStatus.Status roaming = 2;
     ForbiddenStatus.Status forbidden = 3;
     PreferredStatus.Status preferred = 4;
 }

 message OperatorInfo {
     string name = 1;
     string mcc = 2;
     string mnc = 3;
     RadioTechnology rat = 4;
     OperatorStatus operator_status = 5;
 }

 message EcallConfig {
    repeated EcallConfigType config_validity_mask = 1;   /**< Indicates the valid configuration
                            parameters in the structure. A bit set to 1 denotes that the
                            corresponding configuration parameter is valid */
    bool mute_rx_audio = 2;   /* Mute the local audio device(ex: speaker) during MSD transmission */
    ECallNumType num_type = 3; /* Represents the type of number to be dialed when eCall is
                                  initiated */
    string overridden_num = 4; /* User configured/overridden number that will be dialed when
                                  ECallNumType configuration parameter is set to OVERRIDE */
    bool use_canned_msd = 5;   /* Use the pre-defined MSD in modem for eCall */
    int32 gnss_update_interval = 6; /* Time interval in milliseconds at which the modem updates the
                                    GNSS information, in its internally generated MSD */
    int32 t2_timer = 7;   /* T2 timer value in milliseconds, according to EN 16062:2015 standard */
    int32 t7_timer = 8;   /* T7 timer value in milliseconds, according to EN 16062:2015 standard */
    int32 t9_timer = 9;   /* T9 timer value in milliseconds, according to EN 16062:2015 standard */
    int32 msd_version = 10; /* MSD version to be used by modem when it internally generates MSD for
                            transmission */
 }


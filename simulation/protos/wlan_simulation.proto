syntax = "proto3";

package wlanStub;

import "common_simulation.proto";
import "google/protobuf/empty.proto";

/*******************************************************************
* Service Definitions                                             *
*******************************************************************/

// Service for IWlanDeviceManager
service WlanDeviceService {
    rpc InitService(google.protobuf.Empty) returns (GetServiceStatusReply);
    rpc Enable(EnableRequest) returns (DefaultReply);
    rpc SetMode(SetModeRequest) returns (DefaultReply);
    rpc GetConfig(google.protobuf.Empty) returns (GetConfigResponse);
    rpc GetStatus(google.protobuf.Empty) returns (GetStatusResponse);
    rpc SetActiveCountry(SetActiveCountryRequest) returns (DefaultReply);
    rpc GetRegulatoryParams(google.protobuf.Empty) returns (GetRegulatoryParamsResponse);
    rpc SetTxPower(SetTxPowerRequest) returns (DefaultReply);
    rpc GetTxPower(google.protobuf.Empty) returns (GetTxPowerResponse);
}

// Service for IApInterfaceManager
service ApInterfaceService {
    rpc InitService(google.protobuf.Empty) returns (GetServiceStatusReply);
    rpc SetConfig(SetConfigRequest) returns (DefaultReply);
    rpc SetSecurityConfig(SetSecurityConfigRequest) returns (DefaultReply);
    rpc SetSsid(SetSsidRequest) returns (DefaultReply);
    rpc SetVisibility(SetVisibilityRequest) returns (DefaultReply);
    rpc SetElementInfoConfig(SetElementInfoConfigRequest) returns (DefaultReply);
    rpc SetPassPhrase(SetPassPhraseRequest) returns (DefaultReply);
    rpc GetConfig(google.protobuf.Empty) returns (ApGetConfigResponse);
    rpc GetStatus(google.protobuf.Empty) returns (ApGetStatusResponse);
    rpc GetConnectedDevices(google.protobuf.Empty) returns (GetConnectedDevicesResponse);
    rpc ManageApService(ManageApServiceRequest) returns (DefaultReply);
}

// Service for IStaInterfaceManager
service StaInterfaceService {
    rpc InitService(google.protobuf.Empty) returns (GetServiceStatusReply);
    rpc SetIpConfig(StaSetIpConfigRequest) returns (DefaultReply);
    rpc SetBridgeMode(StaSetBridgeModeRequest) returns (DefaultReply);
    rpc EnableHotspot2(StaEnableHotspot2Request) returns (DefaultReply);
    rpc GetConfig(google.protobuf.Empty) returns (StaGetConfigResponse);
    rpc GetStatus(google.protobuf.Empty) returns (StaGetStatusResponse);
    rpc StartScan(StaStartScanRequest) returns (DefaultReply);
    rpc AddNetworkConfig(StaAddNetworkConfigRequest) returns (DefaultReply);
    rpc RemoveNetworkConfig(StaRemoveNetworkConfigRequest) returns (DefaultReply);
    rpc GetNetworkConfigs(StaGetNetworkConfigsRequest) returns (StaGetNetworkConfigsResponse);
    rpc Connect(StaConnectRequest) returns (DefaultReply);
    rpc Disconnect(StaDisconnectRequest) returns (DefaultReply);
    rpc ManageStaService(StaManageStaServiceRequest) returns (DefaultReply);
}

/*******************************************************************
* Enum Definitions                                                *
*******************************************************************/

// Corresponds to telux::wlan::BandType
enum BandType {
    BAND_TYPE_UNKNOWN = 0;
    BAND_5GHZ = 1;
    BAND_2GHZ = 2;
    BAND_6GHZ = 3;
}

// Corresponds to telux::wlan::ConnectionStatus
enum ConnectionStatus {
    CONN_STATUS_UNKNOWN = 0;
    CONNECTED = 1;
    DISCONNECTED = 2;
}

// Corresponds to telux::wlan::Id
enum Id {
    ID_UNKNOWN = 0;
    PRIMARY = 1;
    SECONDARY = 2;
    TERTIARY = 3;
    QUATERNARY = 4;
}

// Corresponds to telux::wlan::ApType
enum ApType {
    AP_TYPE_UNKNOWN = 0;
    PRIVATE = 1;
    GUEST = 2;
}

// Corresponds to telux::wlan::StaInterfaceStatus
enum StaInterfaceStatus {
    STA_IF_STATUS_UNKNOWN = 0;
    CONNECTING = 1;
    STA_IF_CONNECTED = 2;
    STA_IF_DISCONNECTED = 3;
    ASSOCIATION_FAILED = 4;
    IP_ASSIGNMENT_FAILED = 5;
}

// Corresponds to telux::wlan::StaConnectionStatus
enum StaConnectionStatus {
    STA_CONN_STATUS_UNKNOWN = 0;
    SUCCESS = 1;
    INCORRECT_PSK = 2;
    AP_NOT_FOUND = 3;
}

// Corresponds to telux::wlan::OperationType
enum OperationType {
    WLAN_LOCAL = 0;
    WLAN_REMOTE = 1;
}

// Corresponds to telux::wlan::ServiceOperation
enum ServiceOperation {
    SERV_OP_UNKNOWN = 0;
    STOP = 1;
    START = 2;
    RESTART = 3;
}

// Corresponds to telux::wlan::InterfaceState
enum InterfaceState {
    IF_STATE_UNKNOWN = 0;
    INACTIVE = 1;
    ACTIVE = 2;
}

// Corresponds to telux::wlan::HwDeviceType
enum HwDeviceType {
    HW_DEV_TYPE_UNKNOWN = 0;
    QCA6574 = 1;
    QCA6696 = 2;
    QCA6595 = 3;
}

// Corresponds to telux::wlan::DevicePerfState
enum DevicePerfState {
    DEV_PERF_STATE_UNKNOWN = 0;
    FULL = 1;
    REDUCED = 2;
    SHUTDOWN = 3;
}

// Corresponds to telux::wlan::ApInterworking
enum ApInterworking {
    AP_INTERWORKING_UNKNOWN = 0;
    INTERNET_ACCESS = 1;
    FULL_ACCESS = 2;
}

// Corresponds to telux::wlan::ApDeviceConnectionEvent
enum ApDeviceConnectionEvent {
    AP_DEV_CONN_EVENT_UNKNOWN = 0;
    AP_DEV_CONNECTED = 1;
    AP_DEV_DISCONNECTED = 2;
    IPV4_UPDATED = 3;
    IPV6_UPDATED = 4;
}

// Corresponds to telux::wlan::SecMode
enum SecMode {
    SEC_MODE_UNKNOWN = 0;
    OPEN = 1;
    WEP = 2;
    WPA = 3;
    WPA2 = 4;
    WPA3 = 5;
}

// Corresponds to telux::wlan::SecAuth
enum SecAuth {
    SEC_AUTH_UNKNOWN = 0;
    NONE = 1;
    PSK = 2;
    EAP_SIM = 3;
    EAP_AKA = 4;
    EAP_LEAP = 5;
    EAP_TLS = 6;
    EAP_TTLS = 7;
    EAP_PEAP = 8;
    EAP_FAST = 9;
    EAP_PSK = 10;
    SAE = 11;
}

// Corresponds to telux::wlan::SecEncrypt
enum SecEncrypt {
    SEC_ENCRYPT_UNKNOWN = 0;
    RC4 = 1;
    TKIP = 2;
    AES = 3;
    GCMP = 4;
}

// Corresponds to telux::wlan::NetAccessType
enum NetAccessType {
    NET_ACCESS_TYPE_UNKNOWN = 0;
    PRIVATE_ACCESS = 1;
    PRIVATE_WITH_GUEST = 2;
    CHARGEABLE_PUBLIC = 3;
    FREE_PUBLIC = 4;
    PERSONAL_DEVICE = 5;
    EMERGENCY_SERVICES_ONLY = 6;
    TEST_OR_EXPERIMENTAL = 7;
    WILDCARD = 8;
}

// Corresponds to telux::wlan::StaIpConfig
enum StaIpConfig {
    STA_IP_CONFIG_UNKNOWN = 0;
    DYNAMIC_IP = 1;
    STATIC_IP = 2;
}

// Corresponds to telux::wlan::StaBridgeMode
enum StaBridgeMode {
    ROUTER = 0;
    BRIDGE = 1;
}

/*******************************************************************
* Message Definitions                                             *
*******************************************************************/

// Corresponds to telux::wlan::ApInfo
message ApInfo {
    BandType ap_radio = 1;
    ApType ap_type = 2;
}

// Corresponds to telux::wlan::ApNetInfo
message ApNetInfo {
    ApInfo info = 1;
    string ssid = 2;
}

// Corresponds to telux::wlan::ApStatus
message ApStatus {
    Id id = 1;
    string name = 2;
    string ipv4_address = 3;
    string mac_address = 4;
    repeated ApNetInfo network = 5;
}

// Corresponds to telux::wlan::StaStatus
message StaStatus {
    Id id = 1;
    string name = 2;
    string ipv4_address = 3;
    string ipv6_address = 4;
    string mac_address = 5;
    StaInterfaceStatus status = 6;
    StaConnectionStatus connection_status = 7;
}

// Corresponds to telux::wlan::InterfaceStatus
message InterfaceStatus {
    HwDeviceType device = 1;
    repeated ApStatus ap_status = 2;
    repeated StaStatus sta_status = 3;
}

// Corresponds to telux::wlan::RegulatoryParams
message RegulatoryParams {
    string country = 1;
    float op_channel = 2;
    repeated float op_class = 3;
    uint32 tx_power_mw = 4;
}

// Corresponds to telux::wlan::ApVenueInfo
message ApVenueInfo {
    int32 type = 1;
    int32 group = 2;
}

// Corresponds to telux::wlan::ApSecurity
message ApSecurity {
    SecMode mode = 1;
    SecAuth auth = 2;
    SecEncrypt encrypt = 3;
}

// Corresponds to telux::wlan::ApElementInfoConfig
message ApElementInfoConfig {
    bool is_enabled = 1;
    bool is_interworking_enabled = 2;
    NetAccessType net_access_type = 3;
    bool internet = 4;
    bool asra = 5;
    bool esr = 6;
    bool uesa = 7;
    uint32 venue_group = 8;  // uint8_t
    uint32 venue_type = 9;   // uint8_t
    string hessid = 10;
    string vendor_elements = 11;
    string assoc_resp_elements = 12;
}

// Corresponds to telux::wlan::ApNetConfig
message ApNetConfig {
    ApInfo info = 1;
    string ssid = 2;
    bool is_visible = 3;
    ApElementInfoConfig element_info_config = 4;
    ApInterworking interworking = 5;
    ApSecurity ap_security = 6;
    string pass_phrase = 7;
}

// Corresponds to telux::wlan::ApConfig
message ApConfig {
    Id id = 1;
    ApVenueInfo venue = 2;
    repeated ApNetConfig network = 3;
}

// Corresponds to telux::wlan::DeviceIndInfo
message DeviceIndInfo {
    Id id = 1;
    string mac_address = 2;
}

// Corresponds to telux::wlan::DeviceInfo
message DeviceInfo {
    Id id = 1;
    string name = 2;
    string ipv4_address = 3;
    repeated string ipv6_address = 4;
    string mac_address = 5;
}

// Corresponds to telux::wlan::StaStaticIpConfig
message StaStaticIpConfig {
    string ip_addr = 1;
    string gw_ip_addr = 2;
    string net_mask = 3;
    string dns_addr = 4;
}

// Corresponds to telux::wlan::StaNetworkConfig
message StaNetworkConfig {
    string ssid = 1;
    uint32 priority = 2; // uint16_t
    BandType band = 3;
    string bssid = 4;
}

// Corresponds to telux::wlan::StaNetworkConfigEntry
message StaNetworkConfigEntry {
    StaNetworkConfig sta_network_config = 1;
    string pass_phrase = 2;
    bool enable = 3;
}

// Corresponds to telux::wlan::StaNetworkConfigInfo
message StaNetworkConfigInfo {
    StaNetworkConfig sta_network_config = 1;
    uint32 network_id = 2; // uint16_t
    bool is_current = 3;
}

// Corresponds to telux::wlan::StaConfig
message StaConfig {
    Id sta_id = 1;
    StaIpConfig ip_config = 2;
    StaStaticIpConfig static_ip_config = 3;
    StaBridgeMode bridge_mode = 4;
}

// Corresponds to telux::wlan::ExternalApInfo
message ExternalApInfo {
    string ssid = 1;
    string bssid = 2;
    BandType band = 3;
    string security_flags = 4;
    int32 signal_strength = 5; // int16_t
}

// Corresponds to telux::wlan::StaScanResult
message StaScanResult {
    Id sta_id = 1;
    repeated ExternalApInfo external_ap_list = 2;
    uint32 batch_index = 3; // uint8_t
    bool is_scan_complete = 4;
}

// Common message for service initialization status replies
message GetServiceStatusReply {
    commonStub.ServiceStatus service_status = 1;
    int32 delay = 2;
}

// Common message for default replies with error codes and status
message DefaultReply {
    commonStub.ErrorCode error = 1;
    commonStub.Status status = 2;
    int32 delay = 3;
}

// --- WlanDeviceService Messages ---
message EnableRequest {
    bool enable = 1;
}

message SetModeRequest {
    int32 num_of_ap = 1;
    int32 num_of_sta = 2;
}

message GetConfigResponse {
    DefaultReply default_reply = 1;
    int32 num_ap = 2;
    int32 num_sta = 3;
}

message GetStatusResponse {
    DefaultReply default_reply = 1;
    bool is_enabled = 2;
    repeated InterfaceStatus status = 3;
}

message SetActiveCountryRequest {
    string country = 1;
}

message GetRegulatoryParamsResponse {
    DefaultReply default_reply = 1;
    RegulatoryParams regulatory_params = 2;
}

message SetTxPowerRequest {
    uint32 tx_power_mw = 1;
}

message GetTxPowerResponse {
    DefaultReply default_reply = 1;
    uint32 tx_power_mw = 2;
}

// --- ApInterfaceService Messages ---
message SetConfigRequest {
    ApConfig config = 1;
}

message SetSecurityConfigRequest {
    Id ap_id = 1;
    ApSecurity ap_security = 2;
}

message SetSsidRequest {
    Id ap_id = 1;
    string ssid = 2;
}

message SetVisibilityRequest {
    Id ap_id = 1;
    bool is_visible = 2;
}

message SetElementInfoConfigRequest {
    Id ap_id = 1;
    ApElementInfoConfig config = 2;
}

message SetPassPhraseRequest {
    Id ap_id = 1;
    string pass_phrase = 2;
}

message ApGetConfigResponse {
    DefaultReply default_reply = 1;
    repeated ApConfig config = 2;
}

message ApGetStatusResponse {
    DefaultReply default_reply = 1;
    repeated ApStatus status = 2;
}

message GetConnectedDevicesResponse {
    DefaultReply default_reply = 1;
    repeated DeviceInfo clients_info = 2;
}

message ManageApServiceRequest {
    Id ap_id = 1;
    ServiceOperation opr = 2;
}

// --- StaInterfaceService Messages ---
message StaSetIpConfigRequest {
    Id sta_id = 1;
    StaIpConfig ip_config = 2;
    StaStaticIpConfig static_ip_config = 3;
}

message StaSetBridgeModeRequest {
    Id sta_id = 1;
    StaBridgeMode bridge_mode = 2;
}

message StaEnableHotspot2Request {
    Id sta_id = 1;
    bool enable = 2;
}

message StaGetConfigResponse {
    DefaultReply default_reply = 1;
    repeated StaConfig config = 2;
}

message StaGetStatusResponse {
    DefaultReply default_reply = 1;
    repeated StaStatus status = 2;
}

message StaStartScanRequest {
    Id sta_id = 1;
}

message StaAddNetworkConfigRequest {
    Id sta_id = 1;
    StaNetworkConfigEntry network = 2;
}

message StaRemoveNetworkConfigRequest {
    Id sta_id = 1;
    uint32 network_id = 2; // uint16_t
}

message StaGetNetworkConfigsRequest {
    Id sta_id = 1;
}

message StaGetNetworkConfigsResponse {
    DefaultReply default_reply = 1;
    repeated StaNetworkConfigInfo network = 2;
}

message StaConnectRequest {
    Id sta_id = 1;
    uint32 network_id = 2; // uint16_t
}

message StaDisconnectRequest {
    Id sta_id = 1;
}

message StaManageStaServiceRequest {
    Id sta_id = 1;
    ServiceOperation opr = 2;
}

// --- Unsolicited Events (Listener Callbacks) Messages ---
// For IWlanListener
message OnWlanServiceStatusChange {
    commonStub.ServiceStatus status = 1;
}

message OnWlanTempCrossed {
    float temperature = 1;
    DevicePerfState perf_state = 2;
}

message OnWlanEnableChanged {
    bool enable = 1;
}

// For IApListener
message OnApDeviceStatusChanged {
    ApDeviceConnectionEvent event = 1;
    repeated DeviceIndInfo info = 2;
}

message OnApBandChanged {
    BandType radio = 1;
}

message OnApConfigChanged {
    Id ap_id = 1;
}

// For IStaListener
message OnStaStatusChanged {
    repeated StaStatus sta_status = 1;
}

message OnStaScanResultUpdated {
    StaScanResult sta_scan_result = 1;
}

message OnStaBandChanged {
    BandType band = 1;
}

}

enum RadioSignalStrengthType {
    GSM_RSSI = 0;     /**< GSM received signal strength indicator.*/
    WCDMA_RSSI = 1;   /**< WCDMA received signal strength indicator.*/
    LTE_SNR = 2;      /**< LTE signal-to-noise ratio.*/
    LTE_RSRQ = 3;     /**< LTE reference signal received quality.*/
    LTE_RSRP = 4;     /**< LTE reference signal received power.*/
    NR5G_SNR = 5;     /**< NR5G signal-to-noise ratio.*/
    NR5G_RSRP = 6;    /**< NR5G reference signal received power.*/
    NR5G_RSRQ = 7;    /**< NR5G reference signal received quality.*/
}

message SignalStrengthThreshold {
    int32 lower_range_threshold = 1;     /**< Lower threshold for the selected
                                          radio technology. */
    int32 upper_range_threshold = 2;     /**< Upper threshold for the selected
                                          radio technology. */
}

message ConfigureSignalStrength {
    SignalStrengthConfigType config_type = 1;
    RadioSignalStrengthType rat_sig_type = 2;
    oneof Request {
        uint32 delta = 3;
        SignalStrengthThreshold threshold = 4;
    }
}

message ConfigureSignalStrengthRequest {
   int32 slot_id = 1;
   repeated ConfigureSignalStrength config = 2;
}

message ConfigureSignalStrengthReply {
    commonStub.ErrorCode error = 1;
    commonStub.Status status = 2;
    int32 delay = 3;
    bool iscallback = 4;
}

message ECallModeReason {
    enum Reason {
        NORMAL = 0;
        ERA_GLONASS = 1;
    }
    Reason reason = 1;
}

message GetNetworkRejectInfoRequest {
    int32 phone_id = 1;
}

message GetCallBarringInfoRequest {
    int32 phone_id = 1;
}

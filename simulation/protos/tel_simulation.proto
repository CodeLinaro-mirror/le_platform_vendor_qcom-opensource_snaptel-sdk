 service NetworkSelectionService {
     rpc InitService (commonStub.GetServiceStatusRequest) returns (commonStub.GetServiceStatusReply) {}
     rpc GetServiceStatus(commonStub.GetServiceStatusRequest) returns (commonStub.GetServiceStatusReply) {}
     rpc CleanUpService (google.protobuf.Empty) returns (google.protobuf.Empty) {}
     rpc RequestNetworkSelectionMode (RequestNetworkSelectionModeRequest) returns

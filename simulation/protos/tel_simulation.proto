    bool is_mute_rx_audio_valid = 1;
    bool mute_rx_audio = 2;  /* Mute the local audio device(ex: speaker) during MSD transmission */
    bool is_num_type_valid = 3;
    ECallNumType num_type = 4; /* Represents the type of number to be dialed when eCall is
                                  initiated */
    bool is_overridden_num_valid = 5;
    string overridden_num = 6; /* User configured/overridden number that will be dialed when
                                  ECallNumType configuration parameter is set to OVERRIDE */
    bool is_use_canned_msd_valid = 7;
    bool use_canned_msd = 8;   /* Use the pre-defined MSD in modem for eCall */
    bool is_gnss_update_interval_valid = 9;
    int32 gnss_update_interval = 10; /* Time interval in milliseconds at which the modem updates the
                                    GNSS information, in its internally generated MSD */
    bool is_t2_timer_valid = 11;
    int32 t2_timer = 12;  /* T2 timer value in milliseconds, according to EN 16062:2015 standard */
    bool is_t7_timer_valid = 13;
    int32 t7_timer = 14;  /* T7 timer value in milliseconds, according to EN 16062:2015 standard */
    bool is_t9_timer_valid = 15;
    int32 t9_timer = 16;  /* T9 timer value in milliseconds, according to EN 16062:2015 standard */
    bool is_msd_version_valid = 17;
    int32 msd_version = 18; /* MSD version to be used by modem when it internally generates MSD for
                            transmission */
 }


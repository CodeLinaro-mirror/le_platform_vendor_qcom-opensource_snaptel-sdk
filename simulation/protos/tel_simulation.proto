 }

 message QueryFdnLockRequest {
     int32 phone_id = 1;
 }

 message QueryFdnLockReply {
     bool is_available = 1;
     bool state = 2;
     commonStub.ErrorCode error = 3;
     commonStub.Status status = 4;
     int32 delay = 5;
     bool isCallback = 6;
 }
 message updateSimStatusRequest {
     int32 phone_id = 1;
 }

 message updateSimStatusReply{
     CardState card_state = 1;
     repeated CardApp card_apps = 2;
     commonStub.ErrorCode error = 3;
     commonStub.Status status = 4;
     int32 delay = 5;
 }

// --- SmsService ---

 message SendSmsWithoutSmscRequest {
     int32 phone_id = 1;
     string number = 2;
     string message = 3;
     bool delivery_status = 4;
 }
 message SendSmsWithoutSmscReply {
    int32 noofsegments = 1;
    commonStub.Status status = 2;
    commonStub.ErrorCode sentCallback_errorcode = 3;
    int32 sentcallback_callbackdelay = 4;
    string sentcallback_msgrefs = 5;
    commonStub.ErrorCode deliverycallback_errorCode = 6;
    int32 deliveryCallback_callbackDelay = 7;
 }

 message GetSmscAddressRequest {
     int32 phone_id = 1;
 }

 message GetSmscAddressReply {
     string smsc_address = 1;
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool iscallback = 5;
 }

 message SetSmscAddressRequest {
     int32 phone_id = 1;
     string number = 2;
 }

 message SetSmscAddressReply {
     commonStub.ErrorCode error = 1;
     commonStub.Status status = 2;
     int32 delay = 3;
     bool iscallback = 4;
 }

 message GetMessageAttributesRequest {
     string message = 1;
     int32 phone_id = 2;
 }

 message MessageAttributes {
     enum SmsEncoding {
         GSM7 = 0;
         GSM8 = 1;
         UCS2 = 2;
         UNKNOWN = 3;
     }
     SmsEncoding encoding = 1;
     int32 number_of_segments = 2;
     int32 segment_size = 3;
     int32 number_of_chars_left_in_last_segment = 4;
 }

 message GetMessageAttributesReply {
     MessageAttributes message_attribute = 1;
 }

 message SendSmsRequest {
     int32 phone_id = 1;
 }
 message Deliverycallback {
    commonStub.ErrorCode ondeliveryreport_errorCode = 1;
    int32 ondeliveryreportmsgRef = 2;
    int32 deliverycallbackdelay = 3;
 }

 message SendSmsReply {
     int32 noofsegments = 1;
     commonStub.Status status = 2;
     commonStub.ErrorCode smsresponsecb_errorCode = 3;
     int32 smsresponsecb_callbackDelay = 4;
     string sentcallback_msgrefs = 5;
     repeated Deliverycallback records = 6;
 }

 message PduBuffer {
     repeated string pdu_buffer = 1;
 }

 message SendRawSmsRequest {
     int32 phone_id = 1;
     int32 size = 2;
 }

 message SendRawSmsReply {
     string reciever_address = 1;
     commonStub.Status status = 2;
     commonStub.ErrorCode smsresponsecb_errorCode = 3;
     int32 smsresponsecb_callbackDelay = 4;
     string sentcallback_msgrefs = 5;
     repeated Deliverycallback records = 6;
 }

 message SmsTagType {
    enum TagType {
        MT_READ = 0;
        UNKNOWN = -1;
        MT_NOT_READ = 1;
    }
 }

 message RequestSmsMessageListRequest {
    int32 phone_id = 1;
    SmsTagType.TagType tag_type = 2;
 }

 message SmsMetaInfo {
    bool isMetaInfoValid = 1;
    uint32 msg_index = 2;
    SmsTagType.TagType tag_type = 3;
 }

 message RequestSmsMessageListReply {
    repeated SmsMetaInfo meta_info = 1;
    commonStub.ErrorCode error = 2;
    commonStub.Status status = 3;
    int32 delay = 4;
    bool iscallback = 5;
 }

 message ReadMessageRequest {
    int32 phone_id = 1;
    uint32 msg_index = 2;
 }

 message ReadMessageReply {
    SmsMessage sms_message = 1;
    commonStub.ErrorCode error = 2;
    commonStub.Status status = 3;
    int32 delay = 4;
    bool iscallback = 5;
 }

 message IsMemoryFullRequest {
    int32 phone_id = 1;
 }

 message IsMemoryFullReply {
    bool ismemoryfull = 1;
 }

 message DelType {
    enum DeleteType {
        DELETE_ALL = 0;
        UNKNOWN = -1;
        DELETE_MESSAGES_BY_TAG = 1;
        DELETE_MSG_AT_INDEX = 2;
    }
 }

 message DeleteMessageRequest {
    int32 phone_id = 1;
    DelType.DeleteType del_type = 2;
    SmsTagType.TagType tag_type = 3;
    uint32 msg_index = 4;
 }
 message DeleteMessageRequestReply {
    commonStub.ErrorCode error = 1;
    commonStub.Status status = 2;
    int32 delay = 3;
    bool iscallback = 4;
 }

 message StorageType {
    enum Type {
       NONE = 0;
       UNKNOWN = -1;
       SIM = 1;
    }
 }

 message RequestPreferredStorageRequest {
    int32 phone_id = 1;
 }

 message RequestPreferredStorageReply {
    StorageType.Type storage_type = 1;
    commonStub.ErrorCode error = 2;
    commonStub.Status status = 3;
    int32 delay = 4;
    bool iscallback = 5;
 }

 message SetPreferredStorageRequest {
    int32 phone_id = 1;
    StorageType.Type storage_type = 2;
 }
 message SetPreferredStorageReply {
    commonStub.ErrorCode error = 1;
    commonStub.Status status = 2;
    int32 delay = 3;
    bool iscallback = 4;
 }

 message SetTagRequest {
    int32 phone_id = 1;
    uint32 msg_index = 2;
    SmsTagType.TagType tag_type = 3;
 }
 message SetTagReply {
    commonStub.ErrorCode error = 1;
    commonStub.Status status = 2;
    int32 delay = 3;
    bool iscallback = 4;
 }

 message RequestStorageDetailsRequest {
    int32 phone_id = 1;
 }

 message RequestStorageDetailsReply {
    uint32 max_count = 1;
    uint32 available_count = 2;
    commonStub.ErrorCode error = 3;
    commonStub.Status status = 4;
    int32 delay = 5;
    bool iscallback = 6;
 }

 message SmsMessage {
    string text = 1;
    string sender = 2;
    string receiver = 3;
    MessageAttributes.SmsEncoding encoding = 4;
    string pdu = 5;
    string pdu_buff = 6;
    uint32 messageinforef_no = 7;
    uint32 messageinfono_of_segments = 8;
    uint32 messageinfosegment_no = 9;
    bool ismetainfo_valid = 10;
    uint32 msg_index = 11;
    SmsTagType.TagType tag_type = 12;
    int32 phone_id = 13;
 }

 message cardInfoChange {
    int32 phone_id = 1;
    bool card_power = 2;
 }

 message memoryFullEvent {
    int32 phone_id = 1;
    StorageType.Type storage_type = 2;
 }

 message CallDirection {
     enum Direction {
         INCOMING = 0;
         OUTGOING = 1;
         NONE = 2;
     }
 }

 enum CallState {
     CALL_ACTIVE = 0;
     CALL_ON_HOLD = 1;
     CALL_DIALING = 2;
     CALL_INCOMING = 3;
     CALL_WAITING = 4;
     CALL_ALERTING = 5;
     CALL_ENDED = 6;
     CALL_IDLE = -1;
 }

 message CallEndCause {
     enum Cause {
         DUMMY = 0;
         UNOBTAINABLE_NUMBER = 1;
         NO_ROUTE_TO_DESTINATION = 3;
         CHANNEL_UNACCEPTABLE = 6;
         OPERATOR_DETERMINED_BARRING = 8;
         NORMAL = 16;
         BUSY = 17;
         NO_USER_RESPONDING = 18;
         NO_ANSWER_FROM_USER = 19;
         NOT_REACHABLE = 20;
         CALL_REJECTED = 21;
         NUMBER_CHANGED = 22;
         PREEMPTION = 25;
         DESTINATION_OUT_OF_ORDER = 27;
         INVALID_NUMBER_FORMAT = 28;
         FACILITY_REJECTED = 29;
         RESP_TO_STATUS_ENQUIRY = 30;
         NORMAL_UNSPECIFIED = 31;
         CONGESTION = 34;
         NETWORK_OUT_OF_ORDER = 38;
         TEMPORARY_FAILURE = 41;
         SWITCHING_EQUIPMENT_CONGESTION = 42;
         ACCESS_INFORMATION_DISCARDED = 43;
         REQUESTED_CIRCUIT_OR_CHANNEL_NOT_AVAILABLE = 44;
         RESOURCES_UNAVAILABLE_OR_UNSPECIFIED = 47;
         QOS_UNAVAILABLE = 49;
         REQUESTED_FACILITY_NOT_SUBSCRIBED = 50;
         INCOMING_CALLS_BARRED_WITHIN_CUG = 55;
         BEARER_CAPABILITY_NOT_AUTHORIZED = 57;
         BEARER_CAPABILITY_UNAVAILABLE = 58;

### Logger settings ###

# CONSOLE_LOG_LEVEL, FILE_LOG_LEVEL and SYSLOG_LOG_LEVEL
# specify the threshold for log messages

# CONSOLE_LOG_LEVEL enables console logging
# FILE_LOG_LEVEL enables file based logging. Default path LOG_FILE_PATH.
# SYSLOG_LOG_LEVEL enabled syslog logging.
#
# Possible LOG_LEVEL values are NONE, PERF, ERROR, WARNING, INFO, DEBUG
# NONE - No logging.
# PERF - Prints messages with nanoseconds precision timestamp.
# ERROR - Very minimal logging.Prints perf and error messages only.
# WARNING - Prints perf, error and warning messages.
# INFO - Prints perf, errors, warning and information messages.
# DEBUG - Full logging including debug messages.It is intended for debugging purposes only.

CONSOLE_LOG_LEVEL=NONE
FILE_LOG_LEVEL=NONE
SYSLOG_LOG_LEVEL=NONE

# TELUX_LOG_COMPONENT_FILTER allows one or more whitelist which SDK technology domain should be
# logged.
# 0 - All logs are printed.
# 1 - Audio logs are printed.
# 2 - CV2X logs are printed.
# 3 - Data logs are printed.
# 4 - Location logs are printed.
# 5 - Power logs are printed.
# 6 - Telephony logs are printed.
# 7 - Thermal logs are printed.
# 8 - Sensor logs are printed.
# 9 - Platform logs are printed.
# 10 - Security logs are printed.
#
# For logging all component
# use TELUX_LOG_COMPONENT_FILTER=0
#
# For logging more than one component like cv2x and audio (comma separated)
# use TELUX_LOG_COMPONENT_FILTER=2,1

TELUX_LOG_COMPONENT_FILTER=0

# MAX_LOG_FILE_SIZE specifies the maximum allowed size(in bytes) of the log file
# When the log file reaches its maximum size, it is saved as tel.log.backup.
# If the log file again reaches the max, it will be saved again overwriting the previous
# tel.log.backup file.
# So at a given time only one tel.log and tel.backup will exist in system.
# Default MAX_LOG_FILE_SIZE is 5 Mega Bytes.

MAX_LOG_FILE_SIZE=5242880

# LOG_PREFIX_DATE_TIME used to prefix date and time on every log Message
# FALSE - logs with filename and line number, this is default option
# TRUE - logs with date, time, filename and line number

LOG_PREFIX_DATE_TIME=TRUE

# LOG_FILE_PATH specifies the path of the log file
# Specifies the log file path, by default the path is, from where the application runs.

#LOG_FILE_PATH=/data/vendor/telsdk

# LOG_FILE_NAME specifies the name of the log file to be used

LOG_FILE_NAME=tel.log

### RPC port config ###
RPC_PORT = 8089

### Multi SIM settings ###
# MULTISIM_CONFIG specifies type of multi SIM configuration supported. By default multi SIM
# configuration is not enabled.
# For Dual SIM Dual Active use - dsda
# For Dual SIM Dual Standby use - dsds
#
# MULTISIM_CONFIG=dsda

###Location Settings###

#File to be reported: Valid filename: PRE-RECORDED_LOCATION_DATA.csv,
#full path name can be provided ex: /home/user/PRE-RECORDED_LOCATION_DATA.csv
sim.loc.location_report_file_name = PRE-RECORDED_LOCATION_DATA.csv

###Report consumption ###
# When the last client deregisters from getting PVT reports via @ILocationManager::stopReports(),
# this setting controls if the rest of the CSV is read and consumed or if the buffering from the
# recorded file is paused. The buffering and streaming will be resumed when a new client connects.
# For stopping the stream - TRUE
# For the streaming to continue even after deregistration - FALSE
sim.loc.location_report_consumption = TRUE

###Location filtering setting ###
# Used to decide if the position reports need to be filtered and
# reported at client requested time intervals. In case of a glitch in reporting,
# the first report post-glitch will be reported. The rest of the reports will be filtered
# based on the client requested intervals. By default, this setting is enabled.
ENABLE_LOCATION_FILTERING = TRUE

###Capabilties###
# The default capability mask for the location simulation tech.
# Refer to telux::loc::LocCapabilityType for updating default capabilities.
# By default the capabilities enabled are - Time based tracking, GNSS Measurements,
# Constellation enablement, GNSS Single Frequency, CV2X Location basic.
sim.loc.location_default_capabilities = 0x12D

###Data Settings###
sim.data.physical_interface_name = eth0

###Sensor Settings###
# Full path of CSV file for providing buffered sensor data
# for SensorFeatureManager - PRE-RECORDED_SENSOR_BUFFER_DATA.csv
SENSOR_BUFFERED_EVENTS_FILE_NAME = PRE-RECORDED_SENSOR_BUFFER_DATA.csv

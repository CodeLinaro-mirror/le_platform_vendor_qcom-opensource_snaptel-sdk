 enum EcallConfigType {
    ECALL_CONFIG_MUTE_RX_AUDIO = 0;     /**< Mute the local audio device during MSD transmission */
    ECALL_CONFIG_NUM_TYPE = 1;          /**< Decides which number needs to be dialed when an eCall
                                            is initiated */
    ECALL_CONFIG_OVERRIDDEN_NUM = 2;    /**< User configured/overridden number that will be dialed
                                            for eCall */
    ECALL_CONFIG_USE_CANNED_MSD = 3;    /**< Use the pre-defined MSD in modem for eCall */
    ECALL_CONFIG_GNSS_UPDATE_INTERVAL = 4;/**< Time interval in milliseconds, at which modem
                                            updates the GNSS information in its internally
                                            generated MSD */
    ECALL_CONFIG_T2_TIMER = 5;          /**< T2 timer value */
    ECALL_CONFIG_T7_TIMER = 6;          /**< T7 timer value */
    ECALL_CONFIG_T9_TIMER = 7;          /**< T9 timer value */
    ECALL_CONFIG_MSD_VERSION = 8;       /**< MSD version to be used by modem when it internally
                                            generates MSD i.e when MSD is not sent by application
                                            and also canned MSD is not used */
    ECALL_CONFIG_COUNT = 9;
 }

 enum ECallNumType {
    DEFAULT = 0;         /* Default configured number is dialed */
    OVERRIDDEN = 1;      /* User configured/overridden number is dialed */
 }

 enum HlapTimerType {
    UNKNOWN_TIMER = 0;       /**< eCall unknown timer */

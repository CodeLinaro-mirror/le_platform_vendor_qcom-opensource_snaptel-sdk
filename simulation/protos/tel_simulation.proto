message GetCardStateRequest {
     int32 phone_id = 1;
}

 message GetCardStateReply{
     CardState card_state = 1;
 }

 message CardPowerRequest{
    int32 phone_id = 1;
    bool powerup = 2;
 }
 message CardPowerResponse{
     commonStub.ErrorCode error = 2;
     commonStub.Status status = 3;
     int32 delay = 4;
     bool isCallback = 5;
 }
 message Subscription {
     string carrier_name = 1;
     string icc_id = 2;
     int32 mcc = 3;
     int32 mnc = 4;
     string mobile_country_code = 5;
     string mobile_network_code = 6;
     string phone_number = 7;
     int32 slot_id = 8;
     string imsi = 9;
     string gid_1 = 10;
     string gid_2 = 11;
 }

 message GetAllSubscriptionsReply {
    repeated Subscription subscriptions = 1;
 }

 message GetSubscriptionRequest{
     int32 phone_id = 1;
 }

 message SubscriptionEvent {
     int32 phone_id = 1;
 }

 message HangupCallEvent {
     int32 phone_id = 1;
     int32 call_index = 2;
 }

 message CallStateChangeEvent {
    int32 call_index = 1;
    string callstate = 2;
    string remote_party_number = 3;
    int32 phone_id = 4;
}

 message MsdPullRequestEvent {
     int32 phone_id = 1;
 }

 enum AppType {
     APPTYPE_UNKNOWN = 0;
     APPTYPE_SIM = 1;
     APPTYPE_USIM = 2;
     APPTYPE_RUIM = 3;
     APPTYPE_CSIM = 4;
     APPTYPE_ISIM = 5;
 }

 enum AppState {
    PPSTATE_UNKNOWN = 0;
    APPSTATE_DETECTED = 1;
    APPSTATE_PIN = 2;
    APPSTATE_PUK = 3;
    APPSTATE_SUBSCRIPTION_PERSO = 4;
    APPSTATE_READY = 5;
 }

 message CardApp {
     AppType app_type = 1;
     AppState app_state = 2;
     string app_id = 3;
 }

 message GetSupportedAppsRequest {
     int32 slot_id = 1;
 }

 message GetSupportedAppsReply {
     repeated CardApp card_apps = 1;
 }

 // --- CardService ---

 enum CardState {
     CARDSTATE_ABSENT = 0;
     CARDSTATE_PRESENT = 1;
     CARDSTATE_ERROR = 2;
     CARDSTATE_RESTRICTED = 3;
     CARDSTATE_UNKNOWN = -1;
 }

